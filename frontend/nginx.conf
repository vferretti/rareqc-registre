# SPA du portail admin + proxy /api vers le conteneur api (même origine :
# les cookies de session BFF ne traversent jamais de domaine).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Taille max des envois : documents de 10 Mo + champs du formulaire
    # (l'API coupe à 11 Mo et répond 413 au-delà).
    client_max_body_size 11m;

    # L'index ne doit jamais être mis en cache (sinon il référence des
    # bundles disparus après un déploiement) ; les bundles hachés, eux,
    # sont immuables.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Les réponses de l'API portent déjà leurs propres en-têtes de sécurité
    # (middleware securityHeaders) : rien n'est ajouté ici.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream api;
        proxy_pass http://$upstream:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les réponses du BFF portent 3 gros cookies de session (jetons
        # Keycloak) : buffers d'en-têtes plus grands que les 4k par défaut.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        # Le téléversement de documents peut prendre du temps sur un lien lent.
        proxy_read_timeout 120s;
    }
}
