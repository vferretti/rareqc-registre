# Durcissement navigateur, inclus dans le bloc server ET dans chaque location
# qui pose son propre add_header (nginx n'hérite pas des add_header sinon).
# La CSP n'autorise que l'origine du portail, plus le géocodeur du
# gouvernement du Québec appelé par l'autocomplétion d'adresse
# (address-autocomplete.tsx). Les styles inline sont requis par Radix/shadcn ;
# aucun script inline n'est émis par Vite.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://servicescarto.mern.gouv.qc.ca; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
