# Publie les images sur GHCR : ghcr.io/<owner>/rareqc-registre-{api,seed,web}.
# Déclenché par un tag v* (ex. v1.0.0 → tags v1.0.0 et latest) ; la
# composition de production (rareqc-infra/docker-compose.prod.yml) les
# consomme via REGISTRE_IMAGE / REGISTRE_IMAGE_TAG.
name: publish-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api,  context: backend,  target: production }
          - { name: seed, context: backend,  target: seed }
          - { name: web,  context: frontend, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
